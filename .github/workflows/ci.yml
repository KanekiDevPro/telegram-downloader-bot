name: ci

# The gates the repo already treats as its contract: the test suite (which
# includes the committed-env-fragment check in tests/test_config.py — a value
# dotenv and Compose read differently must never ship), the lint, and the
# types. Run on every push and every pull request so a red gate blocks
# shipping — and install from the lockfile (requirements.lock), so "red" means
# this commit broke something, not that the index shipped a new release this
# morning.
on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Tests
        run: python -m pytest

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy .
