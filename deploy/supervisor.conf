; supervisor (or a cPanel/DirectAdmin "supervisor" panel) config.
; Most panels let you paste these fields into a form instead of using this file.
;
;   [program:telegram-downloader-bot]
;   ...
;
; Logs: /var/log/telegram-downloader-bot.log
[program:telegram-downloader-bot]
directory=/opt/telegram-downloader-bot
command=/opt/telegram-downloader-bot/.venv/bin/python main.py
user=bot
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/telegram-downloader-bot.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=PYTHONUNBUFFERED="1"
