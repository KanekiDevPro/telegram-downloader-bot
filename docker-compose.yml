# Full stack: bot + Postgres + Redis + the Cloudflare WARP tunnel + the two embedded
# Cobalt fallback instances, plus an optional self-hosted Bot API server.
#
#   docker compose up -d --build                      # bot + db + redis + cobalt
#   docker compose --profile local-api up -d --build  # + telegram-bot-api (2000 MB)
#   docker compose logs -f bot                        # follow the bot
#
# Dev alternative (infra in Docker, bot on the host):
#   docker compose up -d postgres redis cobalt
#
# The local Bot API server needs TELEGRAM_API_ID and TELEGRAM_API_HASH from
# https://my.telegram.org, so it lives behind the `local-api` profile: without
# credentials it exits immediately and would restart-loop forever. If
# TELEGRAM_API_BASE_URL in .env points at it while the profile is off, the bot
# logs the failure and falls back to the official cloud API (50 MB uploads).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: downloader
      POSTGRES_PASSWORD: downloader
      POSTGRES_DB: downloader
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U downloader -d downloader"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Cloudflare WARP as a local tunnel: the cheapest way out of a datacenter IP that
  # YouTube has flagged, and the reason a banned VPS can still download at all.
  #
  # On by default, because the deployment whose IP is *not* flagged loses nothing by
  # it — the bot probes the tunnel at startup and goes direct when it does not
  # answer (see services/proxy_health.py), so a WARP outage cannot break downloads.
  #
  # What it is: the official Cloudflare WARP client plus gost, which serves HTTP and
  # SOCKS5 on the *same* port 1080 (`GOST_ARGS=-L :1080`). That matters twice over:
  #   • yt-dlp reaches it with an HTTP proxy (`http://warp:1080`) and needs no SOCKS
  #     dependency; `socks5h://warp:1080` also works (requirements.txt installs
  #     PySocks), for anyone who prefers it;
  #   • cobalt's proxy setting is HTTP(S)-only (undici), so a mixed port is what makes
  #     the *fallback* able to use the same tunnel (`cobalt-warp` below).
  #
  # No `ports:` — it is dialled as `warp:1080` from inside this network and by nobody
  # else. The image ships its own HEALTHCHECK (the WARP client's own status), which is
  # what `docker compose ps` reports; nothing here depends on it being *healthy*,
  # only on it being started, so a slow WARP registration cannot hold up the bot.
  #
  # `warp` mode is the client's default, and in that mode it is a *full tunnel*: the
  # whole namespace is routed, which is why the image's own healthcheck can run a
  # plain `curl` and expect `warp=on`, and why a container that shares this namespace
  # (the session generator below) is on the tunnel with no configuration at all. The
  # client can also be put in WARP's **proxy** mode (`warp-cli mode proxy`, then only
  # traffic through 1080 is tunnelled) — the one case where sharing the namespace is
  # *not* enough, and the reason `deploy/session_proxy/` forces Chromium through the
  # proxy and `/doctor` reports the proxy's measured exit instead of trusting a
  # setting.
  warp:
    image: caomingjun/warp
    init: true
    restart: unless-stopped
    # `c 10:200 rwm` is the tun device: containerd ≥ 1.7.24 stopped passing it
    # implicitly (github.com/opencontainers/runc/pull/3468), and without it the
    # client fails with "Operation not permitted" when it opens the tun.
    device_cgroup_rules:
      - "c 10:200 rwm"
    cap_add:
      - NET_ADMIN
    sysctls:
      # Both are required by the WARP client itself: the first so its own outbound
      # packets are not re-routed into the tunnel it is building, the second so it
      # can create the IPv6 route it wants.
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
    environment:
      # The client registers before gost starts listening; 2s is the image default
      # and enough on a normal VPS.
      WARP_SLEEP: ${WARP_SLEEP:-2}
      # Optional: a WARP+ (or Zero Trust) licence, which routes better than the free
      # tier. Empty = free WARP, which is what this deployment needs.
      WARP_LICENSE_KEY: ${WARP_LICENSE_KEY:-}
    volumes:
      # A *named* volume, not `./warp:/var/lib/cloudflare-warp`: the client runs as a
      # non-root user, and a bind mount keeps the host directory's ownership — the
      # same trap the cobalt cookie directory has, and the one thing that would make
      # WARP re-register (and change its exit IP) on every restart.
      - warp-data:/var/lib/cloudflare-warp
    networks:
      default:
        # The session generator shares this container's network namespace (see
        # below), so the name it is configured under has to resolve *here* — this is
        # what keeps `YOUTUBE_SESSION_SERVER=http://yt-session-generator:8080` valid
        # for both the bot and the fallback engine.
        aliases:
          - yt-session-generator
    ports:
      # Published on the host's loopback for the *session generator* (which lives in
      # this network namespace now) so a host-run bot reaches it exactly as before.
      - "127.0.0.1:8080:8080"

  # YouTube "trusted session" server: a real Chromium that generates a po_token
  # bound to this host's public IP — which is the one thing that gets the fallback
  # engine past YouTube's bot check *without* a login (cobalt itself has none, and
  # YOUTUBE_SESSION_SERVER below points it here). On by default, and worth knowing
  # what that costs: it runs Chromium under Xvfb, and its first token can take a few
  # minutes.
  #
  # It has to mint the token on the *same* address the downloads go out from — the
  # generator's own documentation is explicit that a token made on a clean IP is
  # refused for the blocked one — so it is placed behind the tunnel, exactly like
  # yt-dlp: `network_mode` below, plus the forced Chromium proxy that makes the route
  # explicit. Both halves matter, and they cover different WARP modes; see the notes.
  #
  # Turns out it cannot produce a token on every host (the browser has to play a
  # real YouTube embed from this IP). When it will not, /doctor says so instead of
  # promising a session, and the login jar or the PO-token provider above are the
  # other two routes.
  yt-session-generator:
    image: ghcr.io/imputnet/yt-session-generator:webserver
    init: true
    restart: unless-stopped
    # Route 1 — a shared network namespace. Not `HTTP_PROXY`/`HTTPS_PROXY`: measured
    # from the image's own source (imputnet/yt-session-generator), the generator has
    # no proxy flag and Chromium does not read proxy environment variables, so those
    # variables would look like routing and route nothing. Sharing the tunnel's
    # namespace routes at the packet level and puts Chromium on the same WARP exit as
    # yt-dlp — which is the whole requirement, and it is what carries the browser
    # while the WARP client is in its default `warp` (full tunnel) mode.
    #
    # Two consequences, both deliberate: the published port moves to `warp` (a
    # namespace owns its ports), and the name this service is reached by is the
    # `yt-session-generator` alias on `warp`. An operator who would rather keep the
    # generator out of the tunnel can delete this line and restore the `ports:`
    # entry below it — the bot then downloads through WARP while the token comes
    # from the host IP, which YouTube may refuse.
    #
    # Route 2 — the browser argument, in `deploy/session_proxy/sitecustomize.py`.
    # Sharing a namespace only routes everything while the client is in `warp` mode;
    # put the client in WARP's *proxy* mode and only traffic dialled through 1080 is
    # tunnelled, at which point an unconfigured Chromium goes out of this host's own
    # flagged address and every token attempt ends in
    # `timeout waiting for outgoing API request`. The image has no hook for the one
    # switch that fixes that, so the file is mounted as Python's `sitecustomize` —
    # imported by the interpreter itself, before the generator's first line — and
    # wraps `nodriver.start` to add `--proxy-server=<the tunnel>`. It decides per
    # launch (a WARP client switched to proxy mode is picked up by the next refresh),
    # writes its verdict to the shared `runtime/` mount, and `/doctor` reads that
    # back as the browser's route. A browser that is *not* on the tunnel is the one
    # failure that must never be silent, so the wrapper refuses to run unproxied when
    # it cannot install itself at all.
    network_mode: "service:warp"
    depends_on:
      warp:
        condition: service_started
        required: false
    environment:
      # Where the browser must send its traffic. Inside this shared namespace
      # `127.0.0.1` *is* the tunnel container, which is why this is not `warp:1080`.
      # A single dash so `YT_SESSION_CHROMIUM_PROXY=` (empty) can mean "run the
      # browser direct" — the one way to express that on purpose.
      YT_SESSION_CHROMIUM_PROXY: ${YT_SESSION_CHROMIUM_PROXY-socks5://127.0.0.1:1080}
      # `auto` forces the proxy whenever it answers (a browser pointed at a dead proxy
      # has no route at all, while the namespace may still be carrying it), `always`
      # forces it regardless, `never` installs nothing.
      YT_SESSION_PROXY_MODE: ${YT_SESSION_PROXY_MODE-auto}
      YT_SESSION_ROUTE_FILE: /runtime/browser-route.json
      YT_SESSION_TRACE_URL: ${YT_SESSION_TRACE_URL:-https://cloudflare.com/cdn-cgi/trace}
      # The interpreter imports `sitecustomize` from here before running the
      # generator — the single hook this image leaves open. With the mount missing,
      # Python *skips* the file silently, which is why the report file below is also
      # how the bot notices that the patch is not in place at all.
      PYTHONPATH: /opt/session-proxy
    volumes:
      # The *directory*, not the file: a bind mount whose source is missing makes
      # Docker create a directory at the target and the container then refuses to
      # start (the same trap the cookie jar above documents). A directory source
      # cannot do that, and a missing `sitecustomize.py` inside it degrades to "no
      # report file" — which the bot's `/doctor` row names out loud.
      - ./deploy/session_proxy:/opt/session-proxy:ro
      # The verdict, shared with the bot (read-only there). Bind-mounted rather than
      # a named volume so `cat runtime/browser-route.json` answers "which route is
      # the browser on?" on the host as well as in `/doctor`.
      - ${RUNTIME_HOST_DIR:-./runtime}:/runtime
    # Chromium needs more shared memory than Docker's 64 MB default, and this is
    # not a tuning detail: with the default it starts, dies, and takes the whole
    # helper down with it — `Failed to connect to browser`, at which point the
    # generator process exits and `restart` brings it back **every 13 seconds**,
    # forever. A loop like that is invisible in the report (the port is up in
    # between) and costs CPU until someone reads these logs. 1 GB is the usual
    # figure for a browser container; one page is all this ever renders.
    shm_size: "1g"
    healthcheck:
      # The server is listening long before it has a token (/token answers 503 with
      # "not yet generated" while the browser works), so readiness is the doctor's
      # job — this only says "up", and the image's wget is enough for that.
      test:
        - CMD-SHELL
        - "wget -q -S -O /dev/null http://127.0.0.1:8080/token 2>&1 | grep -q 'HTTP/'"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Self-hosted Bot API server. Raises the bot's upload ceiling from 50 MB
  # (cloud) to 2000 MB and, with TELEGRAM_LOCAL=1, serves files straight from
  # disk. This is what makes MAX_FILE_SIZE_MB=2000 actually deliverable.
  telegram-api:
    image: aiogram/telegram-bot-api:latest
    profiles: ["local-api"]
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: ${TELEGRAM_API_LOCAL:-1}
    volumes:
      - telegram-api-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"
    healthcheck:
      # The server binds IPv4 only, so probe 127.0.0.1 (busybox wget resolves
      # `localhost` to ::1 first and reports a bogus "connection refused").
      # The root path answers 404, so accept any HTTP response line rather than
      # wget's exit code, which is non-zero for 4xx.
      test:
        - CMD-SHELL
        - "wget -q -S -O /dev/null http://127.0.0.1:8081/ 2>&1 | grep -q 'HTTP/'"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # YouTube PO-token provider (bgutil). YouTube refuses downloads from flagged IPs;
  # a PO token makes the traffic look like a real player — and it is the one fix
  # that needs no login at all. On by default: the bot's YTDLP_POT_PROVIDER_URL
  # points here, so `docker compose up -d` is the whole setup.
  #
  # The server executes BotGuard scripts, so it is unauthenticated on purpose: its
  # port is published on the host's loopback only, for a host-run bot to reach it —
  # never expose it.
  #
  # Not wanted? Start only the services you do want (`docker compose up -d bot db
  # redis cobalt`): the bot keeps working without this one — yt-dlp rejects the
  # unreachable provider and downloads continue untokened, with one warning in the
  # log — and /doctor says which helper is missing.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:4416:4416"
    healthcheck:
      # The image ships node and nothing else — and /ping is the endpoint yt-dlp's
      # own plugin asks before it trusts the server, so this checks the same thing
      # a download does.
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:4416/ping', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Embedded fallback extractor. This is the safety net for links the primary
  # engine (yt-dlp) is refused on — and it is why COBALT_API_URL needs no
  # configuration at all: the default in core/config.py points here.
  #
  # Worth knowing what it does and does not fix: this instance shares the host's
  # network address, so it CANNOT serve a link that YouTube refused *because of the
  # IP* — for that (and only for that) give it its own way out:
  #
  #   COBALT_HTTP_PROXY=socks5h://user:pass@host:1080   # in .env, then restart
  #
  # What it does fix: an extractor that broke, a site that refuses yt-dlp's
  # requests, and a dead public instance — plus YouTube's per-client bot check,
  # once it has a session (see COBALT_COOKIES_HOST_DIR below). Its port is
  # published on the host's loopback only, never on the public interface: the
  # instance is unauthenticated and nothing outside this stack should reach it.
  cobalt:
    image: ghcr.io/imputnet/cobalt:10
    restart: unless-stopped
    init: true
    environment:
      # Used to build the tunnel URLs the bot downloads from, so it has to be the
      # address the *bot container* resolves — not the public one.
      API_URL: http://cobalt:9000/
      API_PORT: 9000
      # No browser origin calls this instance; the bot is the only client.
      CORS_WILDCARD: 0
      # The bot can legitimately ask for several files a minute (queued tasks and
      # repeat links). The instance is private, so the public limits (20/min, and
      # 40/min for the tunnel that carries the bytes) are raised rather than being
      # paid for by a user whose download is refused at the last step.
      RATELIMIT_MAX: ${COBALT_RATELIMIT_MAX:-120}
      TUNNEL_RATELIMIT_MAX: ${COBALT_TUNNEL_RATELIMIT_MAX:-120}
      # YouTube needs a *session* here too (cobalt has no built-in login). The file
      # below is generated from the bot's own jar (`services/cobalt_cookies.py`),
      # so one export signs both engines in; a po-token/visitor-data server is the
      # other route (YOUTUBE_SESSION_SERVER).
      COOKIE_PATH: /cookies/cookies.json
      # The other route past the same check, for an IP that a login does not save
      # either. On by default (the service above); empty = off. Cobalt re-reads it
      # every 5 minutes on its own, so a fresh token needs no restart.
      YOUTUBE_SESSION_SERVER: ${YOUTUBE_SESSION_SERVER:-http://yt-session-generator:8080}
      # The proxy cobalt's *own* requests take (player, media) — and the env var
      # name is not a guess: `HTTP_PROXY`/`HTTPS_PROXY` are ignored (cobalt's
      # undici dispatcher does not read them), so setting them here is the same as
      # setting nothing. cobalt looks exactly for `API_EXTERNAL_PROXY`
      # (`api.js`: `if (env.externalProxy) setGlobalDispatcher(new ProxyAgent(…))`).
      # A proxy set for the bot (`YTDLP_PROXY`) does not carry cobalt's requests:
      # each engine has its own outbound, so both need the value.
      API_EXTERNAL_PROXY: ${COBALT_HTTP_PROXY:-}
    ports:
      - "127.0.0.1:9000:9000"
    # So a proxy running on the host is reachable by that name on Linux too, not
    # only on Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The one deliberately read-*write* mount in this file: the bot generates
      # the file from its jar, and cobalt rewrites it with the cookies it refreshes
      # (its own write-back loop). The source is a *directory* that always exists,
      # so a missing cookie file is an absent file — not a Docker-created directory
      # where a file was expected. `COBALT_COOKIES_HOST_DIR` moves it.
      #
      # A bind mount keeps the *host* directory's ownership, so this path must be
      # writable by uid 10001 — which is what `mkdir -p cobalt && chmod 777 cobalt`
      # (in install.sh, and in deploy/README.md) is for. A directory Docker
      # created itself is root-owned, and the bot's own check reports that at
      # startup with the fix instead of failing the whole boot.
      - ${COBALT_COOKIES_HOST_DIR:-./cobalt}:/cookies
    healthcheck:
      # wget is what the image ships (no curl); the API answers JSON on `/`.
      test:
        - CMD-SHELL
        - "wget -q -S -O /dev/null http://127.0.0.1:9000/ 2>&1 | grep -q 'HTTP/'"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The *second* node of the fallback pool, and the one that exists for the single
  # failure the embedded instance cannot fix: the host's own address.
  #
  # `cobalt` above talks to YouTube from this machine's IP — fine for an extractor
  # that broke, useless when YouTube flagged the IP. This instance takes the same
  # route yt-dlp does (the WARP tunnel), so when the primary engine is refused and
  # the direct instance fails on the same IP, the third attempt leaves from a
  # different address entirely. That is the whole reason the pool beat a single
  # instance on a flagged VPS.
  cobalt-warp:
    image: ghcr.io/imputnet/cobalt:10
    restart: unless-stopped
    init: true
    depends_on:
      warp:
        condition: service_started
        required: false
    environment:
      API_URL: http://cobalt-warp:9000/
      API_PORT: 9000
      CORS_WILDCARD: 0
      RATELIMIT_MAX: ${COBALT_RATELIMIT_MAX:-120}
      TUNNEL_RATELIMIT_MAX: ${COBALT_TUNNEL_RATELIMIT_MAX:-120}
      # The two current names (undici's EnvHttpProxyAgent), plus the deprecated
      # `API_EXTERNAL_PROXY` that the pinned :10 tag is known to read. Setting both is
      # deliberate belt-and-braces: the pinned tag and current `main` disagree about
      # which one is honoured, and the failure mode of guessing wrong is silent —
      # cobalt would just serve YouTube from the blocked address again. HTTP(S) only:
      # undici cannot dial SOCKS, which is why the tunnel serves HTTP on port 1080.
      HTTP_PROXY: ${WARP_HTTP_PROXY:-http://warp:1080}
      HTTPS_PROXY: ${WARP_HTTP_PROXY:-http://warp:1080}
      API_EXTERNAL_PROXY: ${WARP_HTTP_PROXY:-http://warp:1080}
      # Nothing internal should ever be dialled through the tunnel.
      NO_PROXY: localhost,127.0.0.1,postgres,redis,cobalt,cobalt-warp,pot-provider,yt-session-generator
      # cobalt needs a YouTube *session* to serve it, and the cookies file is not an
      # option here: it is generated once and rewritten by whichever instance refreshes
      # it, so a second writer would race the first (see the mount note above). The
      # session generator is the route that needs no file — and it sits on this same
      # WARP exit (`network_mode: service:warp`), which is exactly what makes its token
      # valid for downloads taken from here.
      YOUTUBE_SESSION_SERVER: ${YOUTUBE_SESSION_SERVER:-http://yt-session-generator:8080}
    ports:
      - "127.0.0.1:9002:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -S -O /dev/null http://127.0.0.1:9000/ 2>&1 | grep -q 'HTTP/'"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # `required: false` is what makes this safe to ask for: the tunnel is a *route*,
      # not a prerequisite. Without it Compose refuses to start a stack whose profile
      # or service was left out (`service required by service but is disabled`), and
      # with it Compose only warns, the bot boots, and its own probe decides whether
      # to use the tunnel (see services/proxy_health.py). `service_started`, not
      # `service_healthy`: WARP's registration must not hold up the boot.
      warp:
        condition: service_started
        required: false
      # Started, not healthy: the fallback is optional by design, and a bot that
      # refuses to boot because a helper is missing is worse than one that says so.
      cobalt:
        condition: service_started
    # No depends_on telegram-api: it is behind a profile, and the bot survives
    # (and reports) an unreachable API server rather than waiting for one.
    # `.env` supplies BOT_TOKEN, ADMIN_IDS, limits, card details, ...
    env_file:
      - path: .env
        required: false
    environment:
      # Service names beat the localhost defaults from .env inside the network.
      DATABASE_URL: postgresql://downloader:downloader@postgres:5432/downloader
      REDIS_URL: redis://redis:6379/0
      DOWNLOAD_DIR: /app/downloads
      # Empty = official cloud API (see .env: TELEGRAM_API_BASE_URL).
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-}
      TELEGRAM_API_LOCAL: ${TELEGRAM_API_LOCAL:-1}
      # The tunnel yt-dlp goes through, on by default (see the `warp` service).
      #
      # Note the *single* dash in `${YTDLP_PROXY-…}`: with the usual `:-`, an
      # explicitly empty `YTDLP_PROXY=` in .env would be read as "unset" and silently
      # replaced by the tunnel — making "run direct" impossible to express. The single
      # dash honours an empty value, so switching the tunnel off is one blank line.
      #
      # Every yt-dlp request goes through it, YouTube or not; the bot probes it at
      # startup and goes direct (with a log line, an admin notice and a /doctor row) if
      # it does not answer, because a dead proxy would otherwise fail every download.
      YTDLP_PROXY: ${YTDLP_PROXY-http://warp:1080}
      # On by default: the pot-provider service above is part of this stack, and a
      # PO token is what a flagged IP needs. A missing provider is survivable —
      # yt-dlp rejects it and continues.
      YTDLP_POT_PROVIDER_URL: ${YTDLP_POT_PROVIDER_URL:-http://pot-provider:4416}
      # Cobalt reads the session server itself; the bot holds the same value only so
      # /doctor can probe the route the fallback will take.
      YOUTUBE_SESSION_SERVER: ${YOUTUBE_SESSION_SERVER:-http://yt-session-generator:8080}
      # Where the session generator writes which route its Chromium took (see
      # `deploy/session_proxy/`). Read-only: the bot reports it, it does not decide
      # it. Empty = the row says so instead of guessing.
      YT_SESSION_ROUTE_FILE: /runtime/browser-route.json
      # The jar is read from the read-only mount below, so a fresh export is
      # live after `docker compose restart bot` (no rebuild). Overridden here
      # rather than in .env because it is a container path.
      COOKIE_FILE: /cookies/cookies.txt
      # The embedded instance (default in core/config.py). Overridable so a
      # deployment can point at an instance elsewhere — or empty to switch the
      # fallback off entirely.
      COBALT_API_URL: ${COBALT_API_URL:-http://cobalt:9000}
      # ...and the tunneled instance as the second node, so one blocked address is not
      # the end of the pool. Single dash again: `COBALT_FALLBACK_URLS=` in .env means
      # "no second node", not "use the default".
      COBALT_FALLBACK_URLS: ${COBALT_FALLBACK_URLS-http://cobalt-warp:9000}
      # Where the cobalt-format cookie file is generated — a container path, like
      # COOKIE_FILE above, because it is the mount below that makes it shared.
      COBALT_COOKIES_DIR: /app/cobalt
    # So `YTDLP_PROXY=http://host.docker.internal:10808` (a proxy on the host)
    # resolves on Linux hosts as well as Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - downloads:/app/downloads
      # The cookie jar is read through a read-only mount, not baked into the image:
      # a fresh export takes effect with `docker compose restart bot` instead of a
      # rebuild, and the container can never overwrite (or leak into an image
      # layer) the file that holds your YouTube login. yt-dlp *rewrites* its
      # cookiefile when a download ends, so the bot hands it a writable copy from
      # downloads/.cookies instead of this mount.
      #
      # The mounted source is a *directory*, deliberately: bind-mounting the file
      # itself (`./cookies.txt:/app/cookies.txt:ro`) makes Docker create a
      # directory when the host file is missing — the state a fresh clone is in —
      # and the container then refuses to start ("not a directory"). A directory
      # source always exists, so an absent jar is simply a missing file inside the
      # container: the bot says so in one warning and keeps serving everything that
      # does not need cookies. `COOKIES_HOST_DIR` moves the mount (e.g. a secrets
      # directory elsewhere on the host) as long as the jar is named cookies.txt.
      - ${COOKIES_HOST_DIR:-./}:/cookies:ro
      # The cobalt-format file generated from that jar (the same host directory the
      # cobalt service reads), so the fallback engine gets the same login. Writable
      # because *this* is where it comes from; an empty COBALT_COOKIES_DIR turns
      # the generation off and the fallback runs without cookies.
      - ${COBALT_COOKIES_HOST_DIR:-./cobalt}:/app/cobalt
      # The session generator's browser verdict (it writes, this only reads). Read
      # through a mount so `/doctor` can answer "is the token browser on the tunnel?"
      # with a measurement rather than with the setting the operator wrote.
      - ${RUNTIME_HOST_DIR:-./runtime}:/runtime:ro

volumes:
  pgdata:
  downloads:
  telegram-api-data:
  # WARP's registration state (its device identity and licence). Persisted so a
  # restart keeps the same exit instead of registering a new one every time.
  warp-data:
